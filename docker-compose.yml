services:
  postgres:
    image: postgres:16-alpine
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro
      POSTGRES_DB: cerebro
    ports:
      # 5432 and 5433 are already claimed by other local projects.
      - "5434:5432"
    volumes:
      - cerebro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cerebro-pgdata:
